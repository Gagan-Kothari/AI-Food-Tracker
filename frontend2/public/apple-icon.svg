<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Green rounded square background matching the app logo (bg-green-500) -->
  <rect width="180" height="180" rx="22" fill="#22c55e"/>
  <!-- Simple apple shape in white -->
  <g transform="translate(90, 90)">
    <!-- Apple body -->
    <ellipse cx="0" cy="9" rx="32" ry="40" fill="#ffffff"/>
    <!-- Apple left curve -->
    <path d="M -22 9 Q -27 0 -22 -14 Q -14 -27 0 -32 Q 14 -27 22 -14 Q 27 0 22 9" fill="#ffffff"/>
    <!-- Apple indent at top -->
    <path d="M -11 -32 Q 0 -40 11 -32" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Leaf -->
    <ellipse cx="14" cy="-36" rx="7" ry="11" fill="#22c55e" transform="rotate(-30 14 -36)"/>
  </g>
</svg>
