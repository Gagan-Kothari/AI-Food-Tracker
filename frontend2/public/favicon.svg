<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Green rounded square background matching the app logo (bg-green-500) -->
  <rect width="100" height="100" rx="12" fill="#22c55e"/>
  <!-- Simple apple shape in white -->
  <g transform="translate(50, 50)">
    <!-- Apple body -->
    <ellipse cx="0" cy="5" rx="18" ry="22" fill="#ffffff"/>
    <!-- Apple left curve -->
    <path d="M -12 5 Q -15 0 -12 -8 Q -8 -15 0 -18 Q 8 -15 12 -8 Q 15 0 12 5" fill="#ffffff"/>
    <!-- Apple indent at top -->
    <path d="M -6 -18 Q 0 -22 6 -18" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Leaf -->
    <ellipse cx="8" cy="-20" rx="4" ry="6" fill="#22c55e" transform="rotate(-30 8 -20)"/>
  </g>
</svg>
